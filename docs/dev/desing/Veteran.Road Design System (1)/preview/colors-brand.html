<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.card{display:flex;gap:16px;align-items:stretch}
.sw{flex:1;border-radius:8px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:94px;font-size:11px;border:1px solid var(--c-border)}
.sw .hex{font-family:var(--font-heading);font-size:13px;letter-spacing:.5px}
.sw .name{font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-size:10px;opacity:.8}
</style></head><body>
<div class="card">
  <div class="sw" style="background:#0a1628;color:#fff;border-color:#0a1628"><div class="name">Navy</div><div class="hex">#0A1628</div></div>
  <div class="sw" style="background:#162a4a;color:#fff;border-color:#162a4a"><div class="name">Navy Mid</div><div class="hex">#162A4A</div></div>
  <div class="sw" style="background:#1e3a5f;color:#fff;border-color:#1e3a5f"><div class="name">Blue</div><div class="hex">#1E3A5F</div></div>
  <div class="sw" style="background:#c8102e;color:#fff;border-color:#c8102e"><div class="name">Red</div><div class="hex">#C8102E</div></div>
  <div class="sw" style="background:#d4a843;color:#0a1628;border-color:#d4a843"><div class="name">Gold</div><div class="hex">#D4A843</div></div>
</div>
</body></html>
