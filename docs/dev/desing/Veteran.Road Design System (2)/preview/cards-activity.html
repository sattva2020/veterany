<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #e0dbd3;border-radius:16px;padding:24px;position:relative;overflow:hidden}
.num{position:absolute;top:14px;right:18px;font-family:var(--font-heading);font-size:40px;font-weight:800;color:#f0ebe3;line-height:1}
.icon{width:48px;height:48px;border-radius:50%;background:rgba(200,16,46,.1);color:#c8102e;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
h3{font-family:var(--font-heading);font-size:18px;color:#0a1628;margin:0 0 8px;font-weight:700}
p{font-size:13px;color:#5a5a5a;line-height:1.6;margin:0}
.card.top::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#c8102e}
</style></head><body>
<div class="grid">
  <div class="card top"><div class="num">01</div><div class="icon">🧠</div><h3>Психологічна підтримка</h3><p>Індивідуальні та групові сесії.</p></div>
  <div class="card"><div class="num">02</div><div class="icon">💪</div><h3>Реабілітація</h3><p>Фізична реабілітація, протезування.</p></div>
</div>
</body></html>
