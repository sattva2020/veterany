<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.stk{display:flex;flex-direction:column;gap:8px}
.sp{background:#c8102e;height:10px;border-radius:2px;display:flex;align-items:center;padding-left:10px;color:#fff;font-family:var(--font-heading);font-size:10px;letter-spacing:.5px}
.lbl{font-size:10px;color:#8a8a8a;width:60px;display:inline-block;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:10px}
</style></head><body>
<div class="stk">
  <div class="row"><span class="lbl">s-1 · 4</span><div class="sp" style="width:4px"></div></div>
  <div class="row"><span class="lbl">s-2 · 8</span><div class="sp" style="width:8px"></div></div>
  <div class="row"><span class="lbl">s-3 · 12</span><div class="sp" style="width:12px"></div></div>
  <div class="row"><span class="lbl">s-4 · 16</span><div class="sp" style="width:16px"></div></div>
  <div class="row"><span class="lbl">s-6 · 24</span><div class="sp" style="width:24px">24</div></div>
  <div class="row"><span class="lbl">s-8 · 32</span><div class="sp" style="width:32px">32</div></div>
  <div class="row"><span class="lbl">s-12 · 48</span><div class="sp" style="width:48px">48</div></div>
  <div class="row"><span class="lbl">s-20 · 80</span><div class="sp" style="width:80px">80</div></div>
  <div class="row"><span class="lbl">s-30 · 120</span><div class="sp" style="width:120px">120 section</div></div>
</div>
</body></html>
