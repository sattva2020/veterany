<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.r{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.b{background:#fff;border:1px solid #e0dbd3;padding:8px 12px;font-family:var(--font-heading);font-size:11px;color:#5a5a5a;letter-spacing:.5px}
.r4{border-radius:4px}.r6{border-radius:6px}.r8{border-radius:8px}.r10{border-radius:10px}.r12{border-radius:12px}.r16{border-radius:16px}.r20{border-radius:20px}.rp{border-radius:100px}
.circle{width:46px;height:46px;background:#c8102e;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800}
</style></head><body>
<div class="r">
  <div class="b r4">4 · switch</div>
  <div class="b r6">6 · small btn</div>
  <div class="b r8">8 · button</div>
  <div class="b r10">10 · input</div>
  <div class="b r12">12 · stat</div>
  <div class="b r16">16 · card</div>
  <div class="b r20">20 · modal</div>
  <div class="b rp">100 · pill</div>
  <div class="circle">В</div>
</div>
</body></html>
