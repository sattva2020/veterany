<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.card{display:flex;gap:16px}
.sw{flex:1;border-radius:8px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:94px;font-size:11px;border:1px solid var(--c-border)}
.sw .hex{font-family:var(--font-heading);font-size:13px;letter-spacing:.5px}
.sw .name{font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-size:10px;opacity:.8}
</style></head><body>
<div class="card">
  <div class="sw" style="background:#faf7f2;color:#1a1a1a"><div class="name">Cream</div><div class="hex">#FAF7F2</div></div>
  <div class="sw" style="background:#f0ebe3;color:#1a1a1a"><div class="name">Cream Dark</div><div class="hex">#F0EBE3</div></div>
  <div class="sw" style="background:#ffffff;color:#1a1a1a"><div class="name">White</div><div class="hex">#FFFFFF</div></div>
  <div class="sw" style="background:#e0dbd3;color:#1a1a1a"><div class="name">Border</div><div class="hex">#E0DBD3</div></div>
  <div class="sw" style="background:#1a1a1a;color:#fff;border-color:#1a1a1a"><div class="name">Text</div><div class="hex">#1A1A1A</div></div>
  <div class="sw" style="background:#5a5a5a;color:#fff;border-color:#5a5a5a"><div class="name">Muted</div><div class="hex">#5A5A5A</div></div>
  <div class="sw" style="background:#8a8a8a;color:#fff;border-color:#8a8a8a"><div class="name">Light</div><div class="hex">#8A8A8A</div></div>
</div>
</body></html>
