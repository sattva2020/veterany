<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.steps::before{content:'';position:absolute;top:32px;left:12.5%;right:12.5%;height:2px;background:linear-gradient(90deg,#c8102e,#d4a843);z-index:0}
.s{text-align:center;position:relative;z-index:1}
.n{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #c8102e;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:var(--font-heading);font-size:22px;font-weight:700;color:#c8102e}
h4{font-family:var(--font-heading);font-size:14px;color:#0a1628;margin:0 0 4px;font-weight:700}
p{font-size:11px;color:#5a5a5a;line-height:1.5;margin:0}
</style></head><body>
<div class="steps">
  <div class="s"><div class="n">1</div><h4>Звернення</h4><p>Телефон або форма</p></div>
  <div class="s"><div class="n">2</div><h4>Консультація</h4><p>Визначення потреб</p></div>
  <div class="s"><div class="n">3</div><h4>План</h4><p>Індивідуальний</p></div>
  <div class="s"><div class="n">4</div><h4>Супровід</h4><p>На кожному етапі</p></div>
</div>
</body></html>
