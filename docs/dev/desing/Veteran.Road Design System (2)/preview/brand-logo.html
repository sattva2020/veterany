<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#0a1628;font-family:var(--font-body);color:#fff}
.logo{display:flex;align-items:center;gap:14px}
.disc{width:56px;height:56px;border-radius:50%;background:#c8102e;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;color:#fff;font-size:24px;letter-spacing:-1px}
.txt{font-family:var(--font-heading);font-size:20px;font-weight:700;line-height:1.2}
.txt span{display:block;font-family:var(--font-body);font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:#d4a843;margin-top:3px}
.hr{height:1px;background:rgba(255,255,255,.08);margin:20px 0}
.row{display:flex;gap:24px;align-items:center}
img{width:90px;height:90px;object-fit:contain}
.small{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.5px}
</style></head><body>
<div class="row">
  <img src="../assets/emblem-monogram.png" alt="Emblem">
  <div>
    <div class="logo">
      <div class="disc">В</div>
      <div class="txt">Ветеран<span>Дорога до нового життя</span></div>
    </div>
    <div class="small" style="margin-top:12px">Horizontal wordmark · Circular emblem · Monogram "ВД"</div>
  </div>
</div>
</body></html>
