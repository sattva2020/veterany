<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#0a1628;font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.j{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:24px;text-align:center}
.icon{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:rgba(200,16,46,.12);display:flex;align-items:center;justify-content:center;font-size:22px}
h3{font-family:var(--font-heading);font-size:17px;color:#fff;margin:0 0 6px;font-weight:700}
p{font-size:12px;color:rgba(255,255,255,.5);line-height:1.6;margin:0}
</style></head><body>
<div class="grid">
  <div class="j"><div class="icon">🤝</div><h3>Волонтерство</h3><p>Долучайтеся до команди.</p></div>
  <div class="j"><div class="icon">🏢</div><h3>Партнерство</h3><p>Масштабування допомоги.</p></div>
</div>
</body></html>
