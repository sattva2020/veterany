<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:28px;background:var(--c-cream);font-family:var(--font-body)}
.r{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.b{width:110px;height:72px;background:#fff;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:11px;color:#5a5a5a;font-family:var(--font-heading);letter-spacing:.5px}
.sm{box-shadow:0 4px 16px rgba(10,22,40,.06)}
.md{box-shadow:0 8px 32px rgba(10,22,40,.08)}
.lg{box-shadow:0 16px 48px rgba(10,22,40,.12)}
.xl{box-shadow:0 20px 56px rgba(10,22,40,.15)}
.red{box-shadow:0 8px 32px rgba(200,16,46,.4);background:#c8102e;color:#fff}
.gold{box-shadow:0 8px 32px rgba(212,168,67,.3);background:#d4a843;color:#0a1628}
</style></head><body>
<div class="r">
  <div class="b sm">SM</div>
  <div class="b md">MD</div>
  <div class="b lg">LG</div>
  <div class="b xl">XL</div>
  <div class="b red">CTA-RED</div>
  <div class="b gold">GOLD</div>
</div>
</body></html>
