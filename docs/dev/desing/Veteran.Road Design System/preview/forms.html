<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-body);color:#1a1a1a}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.fg{display:flex;flex-direction:column}
.fg label{font-size:13px;font-weight:600;color:#0a1628;margin-bottom:8px;letter-spacing:.5px}
.fg input,.fg textarea{font-family:var(--font-body);font-size:14px;padding:12px 16px;border:1px solid #e0dbd3;border-radius:10px;background:#faf7f2;color:#1a1a1a;outline:none}
.fg input:focus,.fg textarea:focus{border-color:#1e3a5f;box-shadow:0 0 0 3px rgba(30,58,95,.08);background:#fff}
.full{grid-column:span 2}
</style></head><body>
<div class="grid">
  <div class="fg"><label>Ім'я</label><input value="Олексій"></div>
  <div class="fg"><label>Email</label><input placeholder="you@example.com"></div>
  <div class="fg full"><label>Повідомлення</label><textarea rows="3">Опишіть вашу ситуацію...</textarea></div>
</div>
</body></html>
