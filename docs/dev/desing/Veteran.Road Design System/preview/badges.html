<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.wrap{display:flex;gap:14px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.hero-b{background:rgba(200,16,46,.15);border:1px solid rgba(200,16,46,.3);color:#d4a843;padding:8px 20px}
.hero-b::before{content:'';width:7px;height:7px;background:#c8102e;border-radius:50%}
.date{background:#c8102e;color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#c8102e}
.stripe{background:#0a1628;color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;font-weight:600}
</style></head><body>
<div class="wrap" style="background:#0a1628;padding:16px;border-radius:12px;margin-bottom:12px">
  <div class="badge hero-b">Громадська організація</div>
</div>
<div class="wrap">
  <div class="badge date">12 Квітня 2026</div>
  <div class="tag">Подія</div>
  <div class="tag" style="color:#0a1628">Партнерство</div>
  <div class="stripe">НОВА ПРОГРАМА</div>
</div>
</body></html>
