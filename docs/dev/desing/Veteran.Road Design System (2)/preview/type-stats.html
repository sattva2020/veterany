<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{background:#fff;border:1px solid #e0dbd3;border-radius:12px;padding:20px 16px;text-align:center}
.n{font-family:var(--font-heading);font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.l{font-size:12px;color:#8a8a8a;letter-spacing:.5px;margin-top:8px;line-height:1.4}
</style></head><body>
<div class="grid">
  <div class="stat"><div class="n" style="color:#c8102e">500+</div><div class="l">Ветеранів отримали допомогу</div></div>
  <div class="stat"><div class="n" style="color:#c8102e">50+</div><div class="l">Партнерів та волонтерів</div></div>
  <div class="stat"><div class="n" style="color:#c8102e">3</div><div class="l">Роки активної діяльності</div></div>
  <div class="stat"><div class="n" style="color:#c8102e">12+</div><div class="l">Напрямів підтримки</div></div>
  <div class="stat"><div class="n" style="color:#c8102e">100+</div><div class="l">Проведених заходів</div></div>
  <div class="stat"><div class="n" style="color:#d4a843">24/7</div><div class="l">Лінія підтримки</div></div>
</div>
</body></html>
