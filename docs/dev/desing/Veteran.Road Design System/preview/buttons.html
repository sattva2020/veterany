<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--c-cream);font-family:var(--font-body)}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:var(--font-body);transition:all .3s ease}
.p{background:#c8102e;color:#fff;padding:16px 36px;border-radius:8px;font-size:15px;font-weight:600}
.p:hover{background:#e01535;transform:translateY(-2px);box-shadow:0 8px 32px rgba(200,16,46,.4)}
.s{color:rgba(10,22,40,.7);font-size:14px;font-weight:500;padding:16px 24px;border:1px solid #e0dbd3;border-radius:8px;background:transparent}
.s:hover{border-color:#0a1628}
.g{background:#d4a843;color:#0a1628;padding:16px 40px;border-radius:8px;font-size:15px;font-weight:700}
.g:hover{background:#f0d48a;transform:translateY(-2px);box-shadow:0 8px 32px rgba(212,168,67,.3)}
.o{background:transparent;color:#0a1628;padding:11px 26px;border:2px solid #0a1628;border-radius:8px;font-size:13px;font-weight:600}
.o:hover{background:#0a1628;color:#fff}
.h{background:#c8102e;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600}
</style></head><body>
<div class="row">
  <button class="btn p">Потребую допомоги →</button>
  <button class="btn s">› Напрями діяльності</button>
  <button class="btn g">Приєднатися →</button>
</div>
<div class="row" style="margin-top:16px">
  <button class="btn o">Усі новини ›</button>
  <button class="btn h">I Need Help</button>
</div>
</body></html>
